<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E3A5F">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>JOY CORPORATION</title>
<style>
:root{--bg:#E8EDF0;--card:#fff;--ink:#1F2A33;--mut:#5d6b76;--navy:#1E3A5F;--brass:#B8892B;--line:#cdd6dc;--ok:#2f7d4f;--bad:#a83a3a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
h1,h2,h3{font-family:Georgia,serif;margin:0}
header{background:var(--navy);color:#fff;padding:12px 16px}
header h1{font-size:20px;letter-spacing:.5px}header small{color:#d8c28a;font-style:italic}
main{flex:1;overflow-y:auto;padding:14px 14px 20px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:12px 2px;font-size:13px;color:var(--mut)}
nav button.on{color:var(--navy);font-weight:700;box-shadow:inset 0 3px 0 var(--brass)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink);margin:4px 0 8px}
textarea{min-height:90px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:11px 14px;font:inherit;font-weight:600}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.sm{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chips button{white-space:nowrap;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:20px;padding:6px 12px;font:inherit;font-size:14px}
.chips button.on{background:var(--navy);color:#fff}
.msg{white-space:pre-wrap;word-wrap:break-word;padding:10px 12px;border-radius:10px;margin:8px 0;max-width:94%}
.msg.u{background:var(--navy);color:#fff;margin-left:auto}.msg.a{background:var(--card);border:1px solid var(--line)}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brass);width:0;transition:width .4s}
.mut{color:var(--mut);font-size:14px}.pre{white-space:pre-wrap;word-wrap:break-word;font-size:15px}
details{margin:6px 0}summary{font-weight:600;color:var(--navy)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;color:#fff;background:var(--mut)}.tag.ok{background:var(--ok)}.tag.bad{background:var(--bad)}.tag.quota{background:var(--brass)}
#lock{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:9;padding:20px;text-align:center}
#lock input{width:200px;text-align:center;font-size:24px;letter-spacing:8px}
.err{color:var(--bad)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="lock"><h1>JOY CORPORATION</h1><small style="color:#d8c28a;font-style:italic">Kami ada karena kamu Ade</small>
<input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off"><button class="btn" style="background:var(--brass)" id="go">Buka kantor</button><div id="lerr" class="err"></div></div>
<header><h1>JOY CORPORATION</h1><small>Kami ada karena kamu Ade</small></header>
<main id="m"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let S;try{S=JSON.parse(localStorage.getItem('jc'))||{}}catch(e){S={}}
S.pin=S.pin||'1234';S.keys=S.keys||[];if(S.key){S.keys.push({id:Date.now(),pv:'gemini',key:S.key,model:S.model||'gemini-2.5-flash',st:'',msg:'',chk:''});S.active=S.keys[0].id;delete S.key;delete S.model}S.active=S.active||null;S.assets=S.assets||[];S.sales=S.sales||[];S.chat=S.chat||{};
const save=()=>{try{localStorage.setItem('jc',JSON.stringify(S))}catch(e){}};
const DIV={
riset:['Riset & Analisis Pasar','Head of Research. Cari tren pasar global (AS/Eropa), bedah masalah pembeli, analisis kompetitor, tentukan harga jual dalam USD.'],
produk:['Produk & Produksi','Lead Product Creator. Rancang blueprint produk digital dan tulis isi materi (e-book/template/panduan) berbahasa Inggris berkualitas tinggi.'],
marketing:['Pemasaran & Penjualan','Chief Marketing Officer. Susun sales page persuasif untuk Gumroad/Etsy/Lemon Squeezy dan naskah konten promosi organik.'],
finance:['Finance','Kepala Finance. Catat hasil penjualan, tentukan harga produk digital, rekap pendapatan. Pembayaran diproses platform dan dikirim ke rekening owner; kamu tidak memproses uang.'],
qa:['Kontrol Kualitas','Quality Assurance. Kritik tajam dan perbaiki setiap hasil kerja sebelum diserahkan ke owner.']};
const SYS=d=>`Kamu adalah ${DIV[d][0]} di Joy Corporation. ${DIV[d][1]} Owner/CEO tidak paham bahasa Inggris: penjelasan dan laporan ditulis dalam Bahasa Indonesia, sedangkan materi untuk pembeli ditulis dalam bahasa Inggris lalu diberi ringkasan Indonesia. Hasil konkret, siap pakai, tanpa basa-basi. Jangan mengarang data pasar sebagai fakta pasti; tandai sebagai perkiraan. Akhiri dengan "Rekomendasi Langkah Berikutnya".`;
const PV={gemini:{n:'Google Gemini',m:['gemini-2.5-flash','gemini-2.5-pro','gemini-2.0-flash']},groq:{n:'Groq',m:['llama-3.3-70b-versatile','llama-3.1-8b-instant']},claude:{n:'Claude (Anthropic)',m:['claude-sonnet-5-5','claude-haiku-5-5','claude-opus-5-5']},hf:{n:'Hugging Face',m:['meta-llama/Llama-3.3-70B-Instruct','Qwen/Qwen2.5-72B-Instruct']},openai:{n:'OpenAI',m:['gpt-4o-mini','gpt-4o']},custom:{n:'Lainnya (kompatibel OpenAI)',m:[]}};
const BASE={openai:'https://api.openai.com/v1',groq:'https://api.groq.com/openai/v1',hf:'https://router.huggingface.co/v1'};
const base=k=>k.pv==='custom'?(k.url||'').replace(/\/+$/,''):BASE[k.pv];
const CH={'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
const aktif=()=>S.keys.find(x=>x.id===S.active);
const AUTH=(r,m)=>r.status===401||r.status===403||/expired|not valid|invalid.*key|invalid x-api-key/i.test(String(m));
function errMsg(r,j){
 const m=(j&&j.error&&(j.error.message||j.error))||'Gagal menghubungi AI';
 if(AUTH(r,m))return 'Kunci API ditolak (tidak valid atau kadaluarsa). Ganti kunci di Setelan. Detail: '+m;
 if(r.status===429)return 'Kuota kunci ini habis atau terlalu banyak permintaan. Coba kunci lain di Setelan.';
 return String(m);
}
function fail(k,r,j){
 const e=new Error(errMsg(r,j));
 if(AUTH(r,(j&&j.error&&(j.error.message||j.error))||'')){k.st='bad';k.msg='Ditolak saat dipakai: tidak valid atau kadaluarsa.';k.chk=new Date().toLocaleString('id-ID');save()}
 return e;
}
async function ai(system,contents){
 const k=aktif();
 if(!k)throw new Error('Belum ada kunci API aktif. Tambahkan dan pilih kunci di tab Setelan.');
 let r,j;
 if(k.pv==='gemini'){
  r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${k.model}:generateContent?key=${encodeURIComponent(k.key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents})});
  j=await r.json();
  if(!r.ok)throw fail(k,r,j);
  const t=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts;
  if(!t)throw new Error('AI tidak memberi jawaban. Coba ulangi.');
  return t.map(p=>p.text||'').join('');
 }
 const msgs=contents.map(c=>({role:c.role==='model'?'assistant':'user',content:c.parts[0].text}));
 if(k.pv==='claude'){
  r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:Object.assign({'Content-Type':'application/json','x-api-key':k.key},CH),body:JSON.stringify({model:k.model,max_tokens:8000,system,messages:msgs})});
  j=await r.json();
  if(!r.ok)throw fail(k,r,j);
  const t=(j.content||[]).map(p=>p.text||'').join('');
  if(!t)throw new Error('AI tidak memberi jawaban. Coba ulangi.');
  return t;
 }
 const b=base(k);if(!b)throw new Error('Alamat API kunci ini kosong. Hapus lalu tambahkan ulang.');
 r=await fetch(b+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+k.key},body:JSON.stringify({model:k.model,messages:[{role:'system',content:system}].concat(msgs)})});
 j=await r.json();
 if(!r.ok)throw fail(k,r,j);
 const c=j.choices&&j.choices[0]&&j.choices[0].message;
 if(!c)throw new Error('AI tidak memberi jawaban. Coba ulangi.');
 return c.content||'';
}
async function cek(k){
 try{
  let r;
  if(k.pv==='gemini')r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1&key='+encodeURIComponent(k.key));
  else if(k.pv==='claude')r=await fetch('https://api.anthropic.com/v1/models?limit=1',{headers:Object.assign({'x-api-key':k.key},CH)});
  else if(k.pv==='hf')r=await fetch('https://huggingface.co/api/whoami-v2',{headers:{Authorization:'Bearer '+k.key}});
  else{const b=base(k);if(!b)return ['bad','Alamat API belum diisi.'];r=await fetch(b+'/models',{headers:{Authorization:'Bearer '+k.key}})}
  if(r.ok)return ['ok','Kunci valid dan siap dipakai.'];
  if(r.status===429)return ['quota','Kunci dikenali tetapi kuota habis atau terlalu banyak permintaan.'];
  if(r.status===400||r.status===401||r.status===403)return ['bad','Kunci tidak valid, salah salin, atau sudah kadaluarsa/dicabut.'];
  if(r.status===404)return ['net','Alamat API tidak ditemukan (kode 404). Periksa alamat yang diisi.'];
  return ['net','Pengecekan gagal (kode '+r.status+'). Coba lagi nanti.'];
 }catch(e){return ['net','Tidak bisa terhubung. Periksa internet atau alamat API, lalu coba lagi.']}
}
const copy=async t=>{try{await navigator.clipboard.writeText(t);alert('Tersalin')}catch(e){alert('Salin manual: tekan lama teks')}};
// ---- tabs
const TABS=[['kantor','Kantor'],['request','Request'],['aset','Aset'],['uang','Keuangan'],['set','Setelan']];
let tab='kantor',cur='riset',busy=false,prog={p:0,t:'',on:false};
function nav(){const n=$('#nav');n.innerHTML='';TABS.forEach(([k,l])=>{const b=el('button',k===tab?'on':'',l);b.onclick=()=>{tab=k;nav();draw()};n.append(b)})}
function draw(){const m=$('#m');m.innerHTML='';({kantor,request,aset,uang,set:setelan})[tab](m);}
// ---- kantor
function kantor(m){
 const ch=el('div','chips');Object.keys(DIV).forEach(k=>{const b=el('button',k===cur?'on':'','@'+DIV[k][0]);b.onclick=()=>{cur=k;draw()};ch.append(b)});m.append(ch);
 const h=S.chat[cur]=S.chat[cur]||[];
 if(!h.length)m.append(el('div','mut','Ketik perintah untuk divisi '+DIV[cur][0]+'. Contoh: "cari 3 ide produk digital yang cepat laku di AS".'));
 h.forEach(x=>m.append(el('div','msg '+(x.role==='user'?'u':'a'),x.parts[0].text)));
 const ta=el('textarea');ta.placeholder='Perintah untuk '+DIV[cur][0];
 const row=el('div','row');const send=el('button','btn','Kirim');const clr=el('button','btn alt','Hapus chat');
 row.append(send,clr);m.append(ta,row);
 clr.onclick=()=>{S.chat[cur]=[];save();draw()};
 send.onclick=async()=>{const t=ta.value.trim();if(!t||busy)return;busy=true;send.disabled=true;send.textContent='Divisi bekerja...';
  h.push({role:'user',parts:[{text:t}]});
  try{const a=await ai(SYS(cur),h.slice(-12));h.push({role:'model',parts:[{text:a}]})}catch(e){h.pop();alert(e.message)}
  busy=false;save();draw();m.scrollTop=m.scrollHeight};
}
// ---- request produk (pipeline)
const STAGES=[
['Riset pasar','riset',(r,o)=>`Request produk dari CEO: "${r}".\nLakukan analisis pasar AS/Eropa: siapa pembelinya, masalah utama mereka, 3 tipe kompetitor dan kelemahannya, celah peluang, dan harga jual USD yang disarankan (tandai sebagai perkiraan). Ringkas dan padat.`],
['Produksi produk','produk',(r,o)=>`Request: "${r}".\nHasil riset:\n${o.riset}\n\nBuat produk digital lengkap, siap dijual, isi dalam bahasa Inggris berkualitas tinggi (judul, struktur, seluruh isi materi). Lalu satu paragraf ringkasan Indonesia.`],
['Kontrol kualitas','qa',(r,o)=>`Kritik produk ini dengan sangat ketat (kejelasan, nilai bagi pembeli, tata bahasa, kesalahan fakta, janji berlebihan). Mulai dengan baris "SKOR: x/10" dan daftar masalah dalam Bahasa Indonesia. Lalu tulis VERSI FINAL yang sudah diperbaiki dalam bahasa Inggris.\n\nProduk:\n${o.produk}`],
['Sales page & konten','marketing',(r,o)=>`Berdasarkan produk final ini, tulis dalam bahasa Inggris: (1) sales page siap tempel di Gumroad (judul, subjudul, 5 poin manfaat, deskripsi, isi paket, FAQ singkat, ajakan beli), (2) 3 naskah video pendek TikTok/Reels. Tambahkan ringkasan Indonesia.\n\nProduk final:\n${o.qa}`],
['Harga & ringkasan','finance',(r,o)=>`Tentukan harga final dalam USD dengan alasan singkat berdasarkan riset ini, dan buat RINGKASAN INDONESIA maksimal 10 baris yang menjelaskan seluruh produk, siapa pembelinya, dan cara menjualnya. Riset:\n${o.riset}\n\nSales page:\n${o.marketing}`]];
function request(m){
 m.append(el('h3',null,'Request Produk'));
 const c=el('div','card');const ta=el('textarea');ta.placeholder='Tulis permintaan produk, mis. "template jurnal syukur 30 hari untuk pasar AS"';
 const go=el('button','btn','Mulai produksi');c.append(ta,go);m.append(c);
 const pc=el('div','card');pc.id='pc';m.append(pc);paint();
 go.onclick=async()=>{const r=ta.value.trim();if(!r||busy)return;busy=true;go.disabled=true;const o={};
  try{for(let i=0;i<STAGES.length;i++){const [n,d,f]=STAGES[i];prog={p:Math.round(i/STAGES.length*100),t:'Tahap '+(i+1)+'/5: '+n+'...',on:true};paint();
    o[d]=await ai(SYS(d),[{role:'user',parts:[{text:f(r,o)}]}])}
   const sk=(o.qa.match(/SKOR:\s*([\d.]+)\/10/i)||[])[1]||'-';
   S.assets.unshift({id:Date.now(),title:r.slice(0,70),date:new Date().toLocaleDateString('id-ID'),skor:sk,riset:o.riset,produk:o.qa,marketing:o.marketing,ringkas:o.finance,ok:false});save();
   prog={p:100,t:'Selesai. Produk tersimpan di tab Aset.',on:false};ta.value=''}
  catch(e){prog={p:prog.p,t:'Berhenti: '+e.message,on:false}}
  busy=false;go.disabled=false;paint()};
}
function paint(){const pc=$('#pc');if(!pc)return;pc.innerHTML='';pc.append(el('div','mut',prog.t||'Belum ada produksi berjalan.'));const b=el('div','bar');const i=el('i');i.style.width=prog.p+'%';b.append(i);pc.append(b,el('div','mut',prog.p+'%'))}
// ---- aset
const dlf=(n,t,mime)=>{const b=new Blob([t],{type:mime||'text/plain;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=n;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)};
const slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'produk';
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const secs=a=>[['Ringkasan Indonesia',a.ringkas],['Produk final (Inggris) dan catatan QA',a.produk],['Sales page dan naskah konten',a.marketing],['Riset pasar',a.riset]];
const stat=a=>'Dibuat '+a.date+' | Skor QA '+a.skor+'/10 | '+(a.ok?'Disetujui CEO':'Menunggu persetujuan');
const pkgTxt=a=>a.title+'\n'+stat(a)+'\n\n'+secs(a).map(([t,x])=>'=== '+t+' ===\n'+x).join('\n\n');
const pkgHtml=a=>'<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(a.title)+'</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:16px;color:#1F2A33}h1{font-family:Georgia,serif;color:#1E3A5F}h2{color:#1E3A5F;border-bottom:2px solid #B8892B;padding-bottom:4px}pre{white-space:pre-wrap;word-wrap:break-word;font:inherit}</style></head><body><h1>'+esc(a.title)+'</h1><p>'+esc(stat(a))+'</p>'+secs(a).map(([t,x])=>'<h2>'+esc(t)+'</h2><pre>'+esc(x)+'</pre>').join('')+'</body></html>';
function aset(m){
 m.append(el('h3',null,'Aset Produk Jadi'));
 if(!S.assets.length)m.append(el('div','mut','Belum ada aset. Buat lewat tab Request.'));
 else{const all=el('button','btn alt sm','Unduh semua aset (.txt)');all.onclick=()=>dlf('joy-semua-aset.txt',S.assets.map(pkgTxt).join('\n\n\n##########\n\n\n'));m.append(all)}
 S.assets.forEach(a=>{const c=el('div','card');c.append(el('b',null,a.title));
  const meta=el('div','mut',stat(a).replace(/ \| (Disetujui CEO|Menunggu persetujuan)$/,'')+' ');const tg=el('span','tag'+(a.ok?' ok':''),a.ok?'Disetujui CEO':'Menunggu persetujuan');meta.append(tg);c.append(meta);
  secs(a).forEach(([t,x],i)=>{const d=el('details');if(i===0)d.open=true;d.append(el('summary',null,t));d.append(el('div','pre',x));const cb=el('button','btn alt sm','Salin');cb.onclick=()=>copy(x);d.append(cb);c.append(d)});
  c.append(el('div','mut','Unduh:'));
  const dr=el('div','row');
  const d1=el('button','btn sm','Paket lengkap (.html)');d1.onclick=()=>dlf(slug(a.title)+'.html',pkgHtml(a),'text/html;charset=utf-8');
  const d2=el('button','btn sm','Paket lengkap (.txt)');d2.onclick=()=>dlf(slug(a.title)+'.txt',pkgTxt(a));
  const d3=el('button','btn sm','Produk final (.txt)');d3.onclick=()=>dlf(slug(a.title)+'-produk-final.txt',a.produk);
  dr.append(d1,d2,d3);c.append(dr);
  c.append(el('div','mut','File .html bisa dibuka di Chrome lalu dicetak jadi PDF lewat menu Bagikan/Cetak.'));
  const row=el('div','row');const ap=el('button','btn alt sm',a.ok?'Batal setuju':'Setujui');ap.onclick=()=>{a.ok=!a.ok;save();draw()};
  const del=el('button','btn alt sm','Hapus');del.onclick=()=>{if(confirm('Hapus aset ini?')){S.assets=S.assets.filter(x=>x!==a);save();draw()}};row.append(ap,del);c.append(row);m.append(c)});
}
// ---- keuangan
function uang(m){
 m.append(el('h3',null,'Keuangan'));
 m.append(el('div','mut','Catat penjualan dari dasbor Gumroad/Etsy. Pembayaran dikirim platform ke rekening Anda; aplikasi ini hanya pencatat.'));
 const tot=S.sales.reduce((s,x)=>s+x.amt,0);const t=el('div','card');t.append(el('b',null,'Total tercatat: $'+tot.toFixed(2)+' ('+S.sales.length+' penjualan)'));m.append(t);
 const c=el('div','card');const p=el('input');p.placeholder='Nama produk';const a=el('input');a.placeholder='Jumlah USD (mis. 9.99)';a.inputMode='decimal';
 const pf=el('select');['Gumroad','Etsy','Lemon Squeezy','Lainnya'].forEach(x=>pf.append(new Option(x,x)));
 const b=el('button','btn','Catat penjualan');c.append(p,a,pf,b);m.append(c);
 b.onclick=()=>{const v=parseFloat(a.value.replace(',','.'));if(!p.value.trim()||!(v>0))return alert('Isi nama produk dan jumlah USD.');S.sales.unshift({p:p.value.trim(),amt:v,pf:pf.value,d:new Date().toLocaleDateString('id-ID')});save();draw()};
 S.sales.forEach(x=>{const r=el('div','card');r.append(el('b',null,x.p+' | $'+x.amt.toFixed(2)),el('div','mut',x.pf+' | '+x.d));const d=el('button','btn alt sm','Hapus');d.onclick=()=>{S.sales=S.sales.filter(y=>y!==x);save();draw()};r.append(d);m.append(r)});
}
// ---- setelan
function setelan(m){
 m.append(el('h3',null,'Setelan'));
 const c=el('div','card');c.append(el('b',null,'Kunci API'));
 c.append(el('div','mut','Kunci yang "Sedang dipakai" menjalankan semua divisi. Kunci hanya tersimpan di HP ini.'));
 if(!S.keys.length)c.append(el('div','mut','Belum ada kunci. Tambahkan di bawah.'));
 const LBL={ok:'Valid',bad:'Tidak valid / kadaluarsa',quota:'Kuota habis',net:'Belum bisa dicek','':'Belum dicek'};
 const run=async k=>{const [x,mm]=await cek(k);k.st=x;k.msg=mm;k.chk=new Date().toLocaleString('id-ID');save()};
 S.keys.forEach(k=>{
  const box=el('div','card');
  box.append(el('b',null,PV[k.pv].n+' | ****'+k.key.slice(-4)),el('div','mut','Model: '+k.model+(k.pv==='custom'?' | '+k.url:'')));
  const r0=el('div','mut');r0.append(el('span','tag '+(k.st||''),LBL[k.st||'']));if(k.chk)r0.append(document.createTextNode(' dicek '+k.chk));box.append(r0);
  if(k.msg)box.append(el('div','mut',k.msg));
  if(k.id===S.active)box.append(el('b',null,'Sedang dipakai'));
  const row=el('div','row');
  const pk=el('button','btn sm','Pakai');pk.onclick=()=>{S.active=k.id;save();draw()};
  const ck=el('button','btn alt sm','Cek');ck.onclick=async()=>{ck.disabled=true;ck.textContent='Mengecek...';await run(k);draw()};
  const dl=el('button','btn alt sm','Hapus');dl.onclick=()=>{if(!confirm('Hapus kunci ini?'))return;S.keys=S.keys.filter(x=>x!==k);if(S.active===k.id)S.active=S.keys[0]?S.keys[0].id:null;save();draw()};
  row.append(pk,ck,dl);box.append(row);c.append(box)});
 if(S.keys.length>1){const all=el('button','btn alt','Cek semua kunci');all.onclick=async()=>{all.disabled=true;all.textContent='Mengecek...';for(const k of S.keys)await run(k);draw()};c.append(all)}
 m.append(c);
 const f=el('div','card');f.append(el('b',null,'Tambah kunci API'));
 const pv=el('select');Object.keys(PV).forEach(x=>pv.append(new Option(PV[x].n,x)));
 const md=el('select');
 const ui=el('input');ui.placeholder='Alamat API, mis. https://api.contoh.com/v1';ui.inputMode='url';
 const mi=el('input');mi.placeholder='Nama model (kosongkan untuk pakai pilihan di atas)';
 const fill=()=>{md.innerHTML='';PV[pv.value].m.forEach(x=>md.append(new Option(x,x)));const c=pv.value==='custom';md.style.display=c?'none':'';ui.style.display=c?'':'none';mi.placeholder=c?'Nama model (wajib)':'Atau ketik nama model sendiri (opsional)'};fill();pv.onchange=fill;
 const ki=el('input');ki.type='password';ki.placeholder='Tempel kunci API di sini';ki.autocomplete='off';
 const ad=el('button','btn','Tambah dan cek');
 ad.onclick=async()=>{const v=ki.value.trim();
  if(v.length<10)return alert('Kunci terlalu pendek.');
  if(S.keys.some(x=>x.key===v))return alert('Kunci ini sudah ada.');
  const model=mi.value.trim()||md.value;
  if(!model)return alert('Isi nama model.');
  if(pv.value==='custom'&&!/^https?:\/\//.test(ui.value.trim()))return alert('Isi alamat API yang diawali https://');
  const k={id:Date.now(),pv:pv.value,key:v,model:model,url:ui.value.trim(),st:'',msg:'',chk:''};
  ad.disabled=true;ad.textContent='Mengecek...';await run(k);
  if(k.st!=='ok'&&!confirm(k.msg+'\n\nTetap simpan kunci ini?')){ad.disabled=false;ad.textContent='Tambah dan cek';return}
  S.keys.push(k);if(!S.active)S.active=k.id;save();draw()};
 f.append(pv,md,ui,mi,ki,ad);m.append(f);
 const p=el('div','card');p.append(el('b',null,'Ganti PIN'));const o=el('input');o.type='password';o.placeholder='PIN lama';const n=el('input');n.type='password';n.placeholder='PIN baru (min. 4 angka)';n.inputMode='numeric';
 const pb=el('button','btn','Ganti PIN');pb.onclick=()=>{if(o.value!==S.pin)return alert('PIN lama salah.');if(n.value.length<4)return alert('PIN baru minimal 4 angka.');S.pin=n.value;save();o.value=n.value='';alert('PIN diganti')};
 p.append(o,n,pb);m.append(p);
 const bk=el('div','card');bk.append(el('b',null,'Cadangan data'),el('div','mut','Berisi aset, penjualan, dan chat. Kunci API dan PIN tidak ikut.'));
 const b1=el('button','btn','Unduh cadangan');b1.onclick=()=>dlf('joy-cadangan-'+Date.now()+'.json',JSON.stringify({assets:S.assets,sales:S.sales,chat:S.chat}),'application/json');
 const fi=el('input');fi.type='file';fi.accept='.json,application/json';
 fi.onchange=()=>{const fl=fi.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.assets)||!Array.isArray(d.sales))throw 0;if(!confirm('Timpa data sekarang dengan cadangan ini?'))return;S.assets=d.assets;S.sales=d.sales;S.chat=d.chat||{};save();draw();alert('Data dipulihkan')}catch(e){alert('File cadangan tidak valid.')}};rd.readAsText(fl)};
 bk.append(b1,el('div','mut','Pulihkan dari file cadangan:'),fi);m.append(bk);
}
// ---- lock
function unlock(){if($('#pin').value===S.pin){$('#lock').style.display='none';$('#pin').value='';$('#lerr').textContent=''}else $('#lerr').textContent='PIN salah.'}
$('#go').onclick=unlock;$('#pin').onkeydown=e=>{if(e.key==='Enter')unlock()};
nav();draw();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
