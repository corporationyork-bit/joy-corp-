const BASE_HASH='7a9ad10839e325ccf431f45f578a88214d1506fd85a5cd22d1120f80c9cb59e4';
function sha256(ascii){
 const rr=(v,a)=>(v>>>a)|(v<<(32-a));const mp=Math.pow,mw=mp(2,32);let result='',i,j;
 const words=[],bl=ascii.length*8;let hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length;const ic={};
 if(!pc){for(let c=2;pc<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}}

 for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return '';words[i>>2]|=j<<((3-i)%4)*8}
 words[words.length]=((bl/mw)|0);words[words.length]=bl;
 for(j=0;j<words.length;){const w=words.slice(j,j+=16);const oh=hash;hash=hash.slice(0,8);
  for(i=0;i<64;i++){const w15=w[i-15],w2=w[i-2];const a=hash[0],e=hash[4];
   const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}

 for(i=0;i<8;i++)for(j=3;j+1;j--){const b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}
 return result;
}

async function ai0(system,contents){
 const k=aktif();
 if(!k)throw new Error('Belum ada kunci API aktif. Tambahkan dan pilih kunci di tab Setelan.');

  if(!t)throw new Error('AI tidak memberi jawaban. Coba ulangi.');
  return t.map(p=>p.text||'').join('');
 }

}

}
async function working(){
 if(wk.run||busy)return;
 if(S.work.mode==='request'&&!S.work.niche){alert('Mode Request: isi dulu arah atau jenis produknya.');return}
 wk.run=true;wk.stop=false;busy=true;await lock(true);draw();logAdd('Sistem','WORKING dimulai ('+(S.work.mode==='request'?'Request: '+S.work.niche:'Otomatis, riset pasar global')+'). Target: '+S.work.target+' produk.');
 try{
  while(!wk.stop){
   if(S.work.day!==hari()){S.work.day=hari();S.work.done=0;save()}
   if(S.work.done>=S.work.target){logAdd('Sistem','Target '+S.work.target+' produk tercapai.');setMsg('Target hari ini ('+S.work.target+' produk) tercapai. Periksa hasilnya di tab Aset.',100);break}
   setMsg('WORKING | Riset: mencari ide produk ke-'+(S.work.done+1)+'...',0);
   const have=S.assets.slice(0,30).map(a=>a.title).join('; ');
   const raw=await aiR(SYS('riset'),[{role:'user',parts:[{text:'Berdasarkan riset tren pasar global (AS/Eropa), pilih 1 ide produk digital baru yang cepat laku'+(S.work.mode==='request'&&S.work.niche?' dengan arah: '+S.work.niche:'')+'. Pilih topik atau kategori yang jelas berbeda dari produk yang sudah ada. Hindari ide yang mirip dengan: '+(have||'(belum ada)')+'. Balas HANYA 1 baris berisi ide produk dalam bahasa Inggris, tanpa penjelasan.'}]}]);
   const idea=raw.trim().split('\n')[0].replace(/^[\s\-*"]+/,'').replace(/^\d+[.)]\s+/,'').replace(/["\s]+$/,'').slice(0,120);
   if(!idea)throw new Error('Ide produk kosong, coba lagi.');
   logAdd(DIV.riset[0],'Ide produk dipilih: '+idea);
   await produce(idea);S.work.done++;save();
   setMsg('Produk selesai: '+idea.slice(0,50)+' ('+S.work.done+'/'+S.work.target+' hari ini)',100);
   await sleep(2500);
  }
 }catch(e){logAdd('Sistem',e.message==='STOP'?'WORKING dihentikan oleh CEO.':'Berhenti karena error: '+e.message);if(e.message!=='STOP')setMsg('Berhenti: '+e.message);else setMsg('Working dihentikan.',prog.p)}
 wk.run=false;busy=false;await lock(false);if(tab==='request')draw();
}

const GRP=(r,o)=>`Berdasarkan produk final dan sales page ini, buat paket unggah Gumroad dalam bahasa Inggris. Jangan menjanjikan penghasilan atau klaim yang tidak bisa dibuktikan. Sebutkan bahwa konten dibuat dengan bantuan AI. Jangan menyebut jumlah halaman, angka statistik pasar, atau klaim ditinjau ahli kecuali tertulis persis di produk final. Deskripsi hanya boleh menjanjikan isi yang benar-benar ada di produk final. Balas PERSIS dalam format ini, tanpa teks lain:\nTITLE: (maks 7 kata)\nSUBTITLE: (maks 12 kata)\nBULLETS: poin 1 | poin 2 | poin 3 (tiap poin maks 5 kata)\nPRICE: (angka USD saja, mis. 9.99)\nDESCRIPTION: (deskripsi produk 120 sampai 200 kata)\n\nProduk final:\n${String(o.fin).slice(0,3500)}\n\nSales page:\n${String(o.marketing).slice(0,3000)}`;
function parseGr(t,fb){
 const g=k=>{const m=String(t).match(new RegExp(k+':\\s*([\\s\\S]*?)(?=\\n[A-Z]{4,}:|$)'));return m?m[1].replace(/\*\*/g,'').trim():''};
 const pr=parseFloat((g('PRICE').match(/[\d.]+/)||[])[0]);
 return {title:g('TITLE')||fb,sub:g('SUBTITLE'),bullets:g('BULLETS').split('|').map(x=>x.trim()).filter(Boolean).slice(0,3),price:pr>0?pr:9.99,desc:g('DESCRIPTION')||String(t)};
}

function wrapT(x,t,w){const ws=String(t).split(/\s+/);const L=[];let c='';ws.forEach(q=>{const n=c?c+' '+q:q;if(x.measureText(n).width>w&&c){L.push(c);c=q}else c=n});if(c)L.push(c);return L}
function coverCanvas(a){
 const g=gFor(a);const c=document.createElement('canvas');c.width=1280;c.height=720;const x=c.getContext('2d');
 x.fillStyle='#0d0f12';x.fillRect(0,0,1280,720);x.strokeStyle='#C4A35A';x.lineWidth=6;x.strokeRect(24,24,1232,672);
 x.fillStyle='#C4A35A';x.fillRect(70,76,140,8);
 x.textBaseline='top';x.fillStyle='#fff';
 let sz=88,L;for(;;){x.font='bold '+sz+'px Georgia,serif';L=wrapT(x,g.title,1140);if(L.length<=3||sz<=46)break;sz-=6}
 let y=110;L.forEach(l=>{x.fillText(l,70,y);y+=sz*1.15});y+=14;
 if(g.sub){x.fillStyle='#d9c48f';x.font='italic 36px Georgia,serif';wrapT(x,g.sub,1140).slice(0,2).forEach(l=>{x.fillText(l,70,y);y+=46})}
 y+=22;x.fillStyle='#fff';x.font='30px system-ui,sans-serif';
 (g.bullets||[]).slice(0,3).forEach(b=>{x.fillText('\u2022  '+b,70,y);y+=44});
 x.fillStyle='#C4A35A';x.font='bold 24px system-ui,sans-serif';x.fillText('JOY CORPORATION',70,652);
 return c;
}

async function pdfLib(){if(window.jspdf)return window.jspdf;await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=ok;s.onerror=()=>no(new Error('Gagal memuat pembuat PDF. Periksa internet lalu coba lagi.'));document.head.append(s)});return window.jspdf}
const cl=t=>String(t||'').replace(/\u2022/g,'-').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/\u2026/g,'...').replace(/\*\*/g,'').replace(/[^\x09\x0A\x20-\xFF]/g,'');
async function makePdf(a){
 const {jsPDF}=await pdfLib();const d=new jsPDF({unit:'pt',format:'a4'});const g=gFor(a);
 const W=595,H=842,M=54,MW=W-2*M;
 d.setFillColor(13,15,18);d.rect(0,0,W,H,'F');
 d.setTextColor(255,255,255);d.setFont('times','bold');d.setFontSize(32);
 let y=220;d.splitTextToSize(cl(g.title),MW).forEach(l=>{d.text(l,M,y);y+=40});
 if(g.sub){d.setFont('times','italic');d.setFontSize(16);d.setTextColor(216,194,138);y+=10;d.splitTextToSize(cl(g.sub),MW).forEach(l=>{d.text(l,M,y);y+=22})}
 d.setFont('helvetica','bold');d.setFontSize(12);d.setTextColor(196,163,90);d.text('JOY CORPORATION',M,H-60);
 d.addPage();d.setTextColor(31,42,51);y=M;
 cl(a.final||a.produk).split('\n').forEach(raw=>{
  let t=raw.trim();const h=/^#{1,3}\s/.test(t);
  if(h){t=t.replace(/^#{1,3}\s+/,'');d.setFont('helvetica','bold');d.setFontSize(15);y+=8}
  else{d.setFont('helvetica','normal');d.setFontSize(11);t=t.replace(/^[*\-]\s+/,'- ')}
  if(!t){y+=8;return}
  d.splitTextToSize(t,MW).forEach(l=>{if(y>H-M){d.addPage();y=M}d.text(l,M,y);y+=h?20:15});
  if(h)y+=2;
 });
 return d.output('blob');
}

function shortOf(a){
 if(a.short)return a.short;const g=gFor(a);const d=String(g.desc||'').replace(/\s+/g,' ').trim();
 if(!d)return g.sub||'';if(d.length<=220)return d;
 const cut=d.slice(0,220);const i=Math.max(cut.lastIndexOf('. '),cut.lastIndexOf('! '),cut.lastIndexOf('? '));

function setelan(m){
 m.append(el('h3',null,'Setelan'));

 const run=async k=>{const [x,mm]=await cek(k);k.st=x;k.msg=mm;if(x!=='ok'){const dd=detect(k.key);if(dd&&dd!==k.pv)k.msg+=' Kunci ini terlihat seperti kunci '+PV[dd].n+', bukan '+PV[k.pv].n+'. Hapus lalu tambahkan ulang dengan penyedia yang benar.'}k.chk=new Date().toLocaleString('id-ID');save()};
 S.keys.forEach(k=>{
  const box=el('div','card');

  const pk=el('button','btn sm','Pakai');pk.onclick=()=>{S.active=k.id;save();draw()};
  const ck=el('button','btn alt sm','Cek');ck.onclick=async()=>{ck.disabled=true;ck.textContent='Mengecek...';await run(k);draw()};
  const em=el('button','btn alt sm','Ubah model');em.onclick=async()=>{const v=prompt('Nama model baru untuk kunci ini:',k.model);if(!v||!v.trim())return;if(/key|token|secret|password/i.test(v))return alert('Itu bukan nama model. Contoh yang benar: llama-3.3-70b-versatile');k.model=v.trim();k.st='';k.msg='';await run(k);draw()};
  const dl=el('button','btn alt sm','Hapus');dl.onclick=()=>{if(!confirm('Hapus kunci ini?'))return;S.keys=S.keys.filter(x=>x!==k);if(S.active===k.id)S.active=S.keys[0]?S.keys[0].id:null;save();draw()};
  row.append(pk,ck,em,dl);box.append(row);c.append(box)});
 if(S.keys.length>1){const all=el('button','btn alt','Cek semua kunci');all.onclick=async()=>{all.disabled=true;all.textContent='Mengecek...';for(const k of S.keys)await run(k);draw()};c.append(all)}
 m.append(c);
 const f=el('div','card');f.append(el('b',null,'Tambah kunci API'));
 const pv=el('select');pv.append(new Option('Pilih penyedia API...',''));['groq','gemini','claude','hf','openai'].forEach(x=>pv.append(new Option(PV[x].n,x)));pv.value='';
 const ki=el('input');ki.type='text';ki.style.webkitTextSecurity='disc';ki.name='k'+Date.now();ki.placeholder='Tempel API key di sini';ki.autocomplete='off';ki.setAttribute('autocapitalize','off');ki.spellcheck=false;
 const dn=el('div','mut','');
 ki.oninput=()=>{const d=detect(ki.value.trim());if(d){pv.value=d;dn.textContent='Terdeteksi otomatis: '+PV[d].n}else dn.textContent=''};
 const ad=el('button','btn','Tambah dan cek');
 const FB={groq:/llama|qwen|gpt-oss/,gemini:/^gemini-/,openai:/^gpt-/};
 ad.onclick=async()=>{const v=ki.value.trim();
  if(!pv.value)return alert('Pilih penyedia API dulu.');
  if(v.length<10)return alert('API key terlalu pendek.');
  const det=detect(v);if(det&&det!==pv.value){pv.value=det;return alert('API key ini terdeteksi sebagai '+PV[det].n+'. Penyedia sudah diubah otomatis, tekan Tambah dan cek lagi.')}
  if(S.keys.some(x=>x.key===v))return alert('API key ini sudah ada.');
  const k={id:Date.now(),pv:pv.value,key:v,model:PV[pv.value].m[0],url:'',st:'',msg:'',chk:''};
  ad.disabled=true;ad.textContent='Mengecek...';
  if(k.pv!=='claude'&&k.pv!=='hf'){try{const ids=await listModels(k);const bad=/whisper|tts|guard|embed|image|live|moderation/i;const pick=PV[k.pv].m.find(x=>ids.includes(x))||ids.find(x=>FB[k.pv]&&FB[k.pv].test(x)&&!bad.test(x));if(pick)k.model=pick}catch(e){}}
  await run(k);
  if(k.st!=='ok'&&!confirm(k.msg+'\n\nTetap simpan?')){ad.disabled=false;ad.textContent='Tambah dan cek';return}
  S.keys.push(k);if(!S.active)S.active=k.id;save();draw()};
 f.append(pv,ki,dn,ad,el('div','mut','Model dipilih otomatis dari akun Anda. Kalau perlu, ubah lewat tombol Ubah model di kartu kunci.'));m.append(f);
 const gc=el('div','card');gc.append(el('b',null,'Gumroad (eksperimen unggah otomatis)'));
 gc.append(el('div','mut','Buat access token di Gumroad: Settings > Advanced > Applications. Token hanya tersimpan di HP ini. Jangan bagikan ke siapa pun.'));
 const gt=el('input');gt.type='text';gt.style.webkitTextSecurity='disc';gt.autocomplete='off';gt.name='g'+Date.now();gt.placeholder='Tempel access token Gumroad';gt.value=S.gtoken||'';
 const gs=el('div','mut',S.gstat||'');

  try{const r=await fetch('https://api.gumroad.com/v2/user',{headers:{Authorization:'Bearer '+S.gtoken}});const j=await r.json().catch(()=>({}));S.gstat=r.ok&&j.success?'Token valid. Akun: '+((j.user&&(j.user.name||j.user.email))||'terhubung'):'Token ditolak (kode '+r.status+'). Buat token baru di Gumroad.'}
  catch(e){S.gstat='Tidak bisa terhubung ke Gumroad dari browser ini (kemungkinan diblokir). Unggah otomatis tidak bisa dipakai, gunakan cara manual.'}
  save();draw()};
 gc.append(gt,gb,gs);m.append(gc);
 const p=el('div','card');p.append(el('b',null,'Ganti PIN'));const o=el('input');o.type='password';o.placeholder='PIN lama';const n=el('input');n.type='password';n.placeholder='PIN baru (min. 4 angka)';n.inputMode='numeric';
 const pb=el('button','btn','Ganti PIN');pb.onclick=()=>{if(!pinOK(o.value))return alert('PIN lama salah.');if(n.value.length<4)return alert('PIN baru minimal 4 angka.');S.pin=n.value;save();o.value=n.value='';alert('PIN diganti')};
 p.append(o,n,pb);m.append(p);

 bk.append(b1,el('div','mut','Pulihkan dari file cadangan:'),fi);m.append(bk);
