function sha256(ascii){
 const rr=(v,a)=>(v>>>a)|(v<<(32-a));const mp=Math.pow,mw=mp(2,32);let result='',i,j;
 const words=[],bl=ascii.length*8;let hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length;const ic={};
 if(!pc){for(let c=2;pc<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}}

 for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return '';words[i>>2]|=j<<((3-i)%4)*8}
 words[words.length]=((bl/mw)|0);words[words.length]=bl;
 for(j=0;j<words.length;){const w=words.slice(j,j+=16);const oh=hash;hash=hash.slice(0,8);
  for(i=0;i<64;i++){const w15=w[i-15],w2=w[i-2];const a=hash[0],e=hash[4];
   const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}

 return result;
}

let lastCut=false;

 try{let out=await ai0(system,contents);let n=0;

}
async function ai0(system,contents){
 lastCut=false;
 const k=aktif();
 if(!k)throw new Error('Belum ada kunci API aktif. Tambahkan dan pilih kunci di tab Setelan.');
 let r,j;
 if(k.pv==='gemini'){
  r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${k.model}:generateContent?key=${encodeURIComponent(k.key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents,generationConfig:{maxOutputTokens:8192}})});

  if(!r.ok)throw fail(k,r,j);

  const t=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts;
  if(!t)throw new Error('AI tidak memberi jawaban. Coba ulangi.');
  return t.map(p=>p.text||'').join('');
 }
 const msgs=contents.map(c=>({role:c.role==='model'?'assistant':'user',content:c.parts[0].text}));
 if(k.pv==='claude'){
  r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:Object.assign({'Content-Type':'application/json','x-api-key':k.key},CH),body:JSON.stringify({model:k.model,max_tokens:8000,system,messages:msgs})});
  j=await r.json();
  if(!r.ok)throw fail(k,r,j);
  lastCut=j.stop_reason==='max_tokens';
  const t=(j.content||[]).map(p=>p.text||'').join('');
  if(!t)throw new Error('AI tidak memberi jawaban. Coba ulangi.');
  return t;
 }
 const b=base(k);if(!b)throw new Error('Alamat API kunci ini kosong. Hapus lalu tambahkan ulang.');
 r=await fetch(b+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+k.key},body:JSON.stringify({model:k.model,max_tokens:8000,messages:[{role:'system',content:system}].concat(msgs)})});
 j=await r.json();
 if(!r.ok)throw fail(k,r,j);
 lastCut=!!(j.choices&&j.choices[0]&&j.choices[0].finish_reason==='length');
 const c=j.choices&&j.choices[0]&&j.choices[0].message;
 if(!c)throw new Error('AI tidak memberi jawaban. Coba ulangi.');
 return c.content||'';
}

function mdPrep(t){
 const out=[];let hdr=null;
 t.split('\n').forEach(raw=>{let l=raw.trim();
  if(/^-{3,}$/.test(l)){out.push('');hdr=null;return}
  if(l.startsWith('|')&&l.endsWith('|')){
   const cells=l.slice(1,-1).split('|').map(c=>c.replace(/<br\s*\/?>/gi,'; ').replace(/\*\*|\*/g,'').trim());
   if(cells.every(c=>/^:?-{2,}:?$/.test(c)))return;
   if(!hdr){hdr=cells;return}
   out.push('- '+cells.map((c,i)=>(hdr[i]?hdr[i]+': ':'')+c).join(' | '));return}
  hdr=null;
  l=l.replace(/<br\s*\/?>/gi,'; ').replace(/\*\*/g,'').replace(/(^|[^*])\*([^*]+)\*/g,'$1$2');
  out.push(l)});
 return out;
}

async function gPost(path,obj,H,method,only){

  try{const opt={method:method||'POST',headers:Object.assign({},H)};
   if(mode==='json'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(obj)}
   else{const u=new URLSearchParams();Object.entries(obj).forEach(([k,v])=>u.append(k,typeof v==='object'?JSON.stringify(v):String(v)));opt.body=u}
   const r=await fetch(GAPI+path,opt);const j=await r.json().catch(()=>({}));
   if(r.ok&&j.success!==false)return j;
   if(r.status===401||r.status===403)throw new Error('token ditolak ('+r.status+')');
  }catch(e){if(/token ditolak/.test(e.message)||mode==='form'||only)throw e}
 }
 throw new Error('Gumroad menolak permintaan '+path);

 const gb=el('button','btn','Simpan dan cek token');
 gb.onclick=async()=>{S.gtoken=gt.value.trim();if(!S.gtoken){S.gstat='';save();draw();return}gb.disabled=true;gb.textContent='Mengecek...';
  try{const r=await fetch('https://api.gumroad.com/v2/user',{headers:{Authorization:'Bearer '+S.gtoken}});const j=await r.json().catch(()=>({}));S.gstat=r.ok&&j.success?'Token valid. Akun: '+((j.user&&(j.user.name||j.user.email))||'terhubung'):'Token ditolak (kode '+r.status+'). Buat token baru di Gumroad.'}
  catch(e){S.gstat='Tidak bisa terhubung ke Gumroad dari browser ini (kemungkinan diblokir). Unggah otomatis tidak bisa dipakai, gunakan cara manual.'}
  save();draw()};
 gc.append(gt,gb,gs);m.append(gc);
 const p=el('div','card');p.append(el('b',null,'Ganti PIN'));const o=el('input');o.type='password';o.placeholder='PIN lama';const n=el('input');n.type='password';n.placeholder='PIN baru (min. 4 angka)';n.inputMode='numeric';
 const pb=el('button','btn','Ganti PIN');pb.onclick=()=>{if(!pinOK(o.value))return alert('PIN lama salah.');if(n.value.length<4)return alert('PIN baru minimal 4 angka.');S.pin=n.value;save();o.value=n.value='';alert('PIN diganti')};
 p.append(o,n,pb);m.append(p);
 const bk=el('div','card');bk.append(el('b',null,'Cadangan data'),el('div','mut','Berisi aset, penjualan, dan chat. Kunci API dan PIN tidak ikut.'));
 const b1=el('button','btn','Unduh cadangan');b1.onclick=()=>dlf('joy-cadangan-'+Date.now()+'.json',JSON.stringify({assets:S.assets,sales:S.sales,chat:S.chat}),'application/json');
 const fi=el('input');fi.type='file';fi.accept='.json,application/json';
 fi.onchange=()=>{const fl=fi.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.assets)||!Array.isArray(d.sales))throw 0;if(!confirm('Timpa data sekarang dengan cadangan ini?'))return;S.assets=d.assets;S.sales=d.sales;S.chat=d.chat||{};save();draw();alert('Data dipulihkan')}catch(e){alert('File cadangan tidak valid.')}};rd.readAsText(fl)};
 bk.append(b1,el('div','mut','Pulihkan dari file cadangan:'),fi);m.append(bk);
}
// ---- lock
function unlock(){const v=$('#pin').value;if(pinOK(v)){$('#lock').style.display='none';$('#pin').value='';$('#lerr').textContent=''}else{$('#lerr').style.color='#c0392b';$('#lerr').textContent='PIN salah.'}}
$('#go').onclick=unlock;$('#pin').onkeydown=e=>{if(e.key==='Enter')unlock()};
$('#forgot').onclick=()=>{if(!confirm('Kembalikan PIN ke PIN dasar? Setelah itu masuk memakai PIN dasar milik owner.'))return;S.pin='BASE';save();$('#pin').value='';$('#lerr').style.color='#1E3A5F';$('#lerr').textContent='PIN sudah dikembalikan ke PIN dasar. Silakan masuk dengan PIN dasar.'};
$('#ago').onclick=()=>{if(pinOK($('#apin').value)){$('#ask').style.display='none';$('#apin').value='';const f=askCb;askCb=null;if(f)f()}else $('#aerr').textContent='PIN salah.'};
$('#apin').onkeydown=e=>{if(e.key==='Enter')$('#ago').click()};
$('#acancel').onclick=()=>{$('#ask').style.display='none';askCb=null};
nav();draw();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
